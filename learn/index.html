<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/output.css" />

    <title>ScamScan — Learn</title>

    <script>
      const theme = localStorage.getItem("theme");

      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body class="flex min-h-screen flex-col bg-stone-50 text-stone-800">
    <div id="header"></div>

    <main class="mx-auto mt-10 w-full max-w-7xl flex-1 space-y-16 px-8">
      <section>
        <h2 class="mb-6 text-5xl font-bold text-stone-900">Learn</h2>
        <p class="text-base">
          Before playing the available games, we recommend exploring these
          curated resources to learn how to identify and recognize potential
          scams.
        </p>
      </section>
    </main>

    <div id="footer"></div>

    <script type="module" src="/js/components.js"></script>
    <script type="module" src="/js/theme.js"></script>
  </body>
</html>
