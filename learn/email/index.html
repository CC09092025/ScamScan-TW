<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/output.css" />

    <script>
      const theme = localStorage.getItem("theme");

      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body
    class="flex min-h-screen flex-col bg-stone-50 text-stone-800 transition-colors dark:bg-[#171615] dark:text-stone-200"
  >
    <div
      id="header"
      class="min-h-20 border-b border-stone-200 bg-white dark:border-stone-800 dark:bg-[#201e1c]"
    ></div>

    <main class="mx-auto mt-10 w-full max-w-7xl flex-1 space-y-16 px-8">
      <section class="pb-12">
        <h2 class="mb-6 text-5xl font-bold text-stone-900 dark:text-white">
          Learn — Email
        </h2>
      </section>
    </main>

    <div id="footer"></div>

    <script type="module" src="/js/components.js"></script>
    <script type="module" src="/js/theme.js"></script>
  </body>
</html>
